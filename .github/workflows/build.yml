name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Clean buildozer cache
      run: |
        rm -rf .buildozer
        rm -rf ~/.buildozer
        rm -rf /home/runner/.buildozer

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install --upgrade Cython==0.29.37
        pip install buildozer==1.5.0 pythonforandroid==2024.1.21
        pip install kivy==2.2.1 pycryptodome requests

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libffi-dev \
          libssl-dev \
          unzip \
          git \
          cmake \
          build-essential \
          libgl1 \
          libgles2-mesa-dev \
          freeglut3-dev

    - name: Build APK
      timeout-minutes: 45
      run: |
        buildozer -v android debug

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: wenxin-app-apk
        path: bin/*.apk

